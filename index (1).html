<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0f7c86">
<title>منصة تقييم التمريض</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Readex+Pro:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* clinical ink + teal accent; one-column mobile app with sticky header */
  --bg:#f3f6f7; --surface:#ffffff; --ink:#14232b; --muted:#5d6f78; --line:#d9e2e6;
  --accent:#0f7c86; --accent-ink:#ffffff; --accent-soft:#e1f1f2;
  --good:#1d7a45; --good-soft:#e3f3ea; --warn:#a15c00; --warn-soft:#fdf0dc; --bad:#b3261e; --bad-soft:#fbe7e5;
  --display:"Readex Pro","IBM Plex Sans Arabic",system-ui,sans-serif;
  --body:"IBM Plex Sans Arabic",system-ui,"Segoe UI",Tahoma,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e171b; --surface:#16232a; --ink:#e4edf0; --muted:#93a6ae; --line:#2a3b43;
  --accent:#3fb6bf; --accent-ink:#06282b; --accent-soft:#163a3e;
  --good:#5fcf8e; --good-soft:#163526; --warn:#f0b35a; --warn-soft:#3a2a12; --bad:#ff8a80; --bad-soft:#3d1a18; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0e171b; --surface:#16232a; --ink:#e4edf0; --muted:#93a6ae; --line:#2a3b43;
  --accent:#3fb6bf; --accent-ink:#06282b; --accent-soft:#163a3e;
  --good:#5fcf8e; --good-soft:#163526; --warn:#f0b35a; --warn-soft:#3a2a12; --bad:#ff8a80; --bad-soft:#3d1a18; color-scheme:dark;}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.6}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.3}
h1{font-size:22px} h2{font-size:18px} h3{font-size:15px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:10px 16px}
.brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.brand .mark{width:34px;height:34px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--display);font-weight:700}
.brand b{font-family:var(--display);font-size:15px;display:block}
.brand small{color:var(--muted);font-size:12px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.demo{background:var(--warn-soft);color:var(--warn);font-size:12px;padding:6px 16px;text-align:center}
main{max-width:860px;margin:0 auto;padding:16px;display:grid;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grow{flex:1}
.muted{color:var(--muted)}
.small{font-size:13px}
label{display:grid;gap:4px;font-size:13px;color:var(--muted)}
input,select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;width:100%}
textarea{min-height:110px;direction:ltr;text-align:left;font-family:ui-monospace,Consolas,monospace;font-size:12px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:10px 16px;font-weight:600}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 10px;font-size:13px}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.block{width:100%}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:99px;background:var(--accent-soft);color:var(--accent)}
.pill.good{background:var(--good-soft);color:var(--good)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.warn{background:var(--warn-soft);color:var(--warn)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.tabs button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 14px;white-space:nowrap;font-weight:600;font-size:13px}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.tile .n{font-family:var(--display);font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}
.tile .l{color:var(--muted);font-size:12px}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th{background:var(--bg);color:var(--muted);font-weight:600;font-size:12px}
tr:last-child td{border-bottom:0}
td.ltr{direction:ltr;text-align:left;white-space:normal;min-width:240px}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;background:var(--accent)}
.exam-item{display:flex;gap:12px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:12px}
/* exam screen */
.exam{user-select:none;-webkit-user-select:none;position:relative}
.wm{position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.06;font-family:var(--display);font-size:20px;display:flex;flex-wrap:wrap;gap:60px 80px;padding:40px;transform:rotate(-20deg);overflow:hidden;color:var(--ink)}
.exam .card{position:relative;z-index:1}
.qhead{display:flex;align-items:center;gap:12px}
.prog{flex:1;height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);transition:width .3s}
.timer{font-family:var(--display);font-weight:700;font-variant-numeric:tabular-nums;padding:4px 10px;border-radius:8px;background:var(--accent-soft);color:var(--accent);min-width:64px;text-align:center}
.timer.low{background:var(--bad-soft);color:var(--bad)}
.stem{direction:ltr;text-align:left;font-size:16px;line-height:1.65}
.opts{display:grid;gap:8px;direction:ltr}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:12px}
.opt .k{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-weight:700;font-size:13px}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.opt[aria-pressed="true"] .k{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.warnbar{background:var(--bad-soft);color:var(--bad);border-radius:10px;padding:10px 12px;font-size:13px}
.rules{margin:0;padding-inline-start:20px;display:grid;gap:4px}
.score{font-family:var(--display);font-size:44px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.review{direction:ltr;text-align:left;border-inline-start:3px solid var(--line);padding:6px 12px;display:grid;gap:4px;font-size:14px}
.review.ok{border-color:var(--good)} .review.no{border-color:var(--bad)}
.grid3{display:grid;grid-template-columns:1fr repeat(3,72px);gap:6px;align-items:center}
.grid3 input{padding:6px;text-align:center}
.hint{background:var(--accent-soft);border-radius:10px;padding:10px 12px;font-size:13px}
.hint code{font-family:ui-monospace,Consolas,monospace;direction:ltr;unicode-bidi:embed}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:grid;place-items:center;padding:16px;z-index:20}
.modal .card{max-width:420px;width:100%}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:30}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

fieldset label{font-size:14px}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>
<header class="top">
  <div class="brand"><div class="mark">ت</div><div><b>منصة تقييم التمريض</b><small id="who">تدريب وتقييم ومتابعة</small></div></div>
  <button class="btn ghost sm" id="pwbtn" hidden>كلمة المرور</button>
  <button class="btn ghost sm" id="logout" hidden>خروج</button>
</header>
<main id="app"><section class="card"><p class="muted" style="margin:0">جاري التحميل…</p></section></main>
<div id="layer"></div>
<script type="module" src="app.js"></script>
</body>
</html>
